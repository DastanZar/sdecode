[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdecode"
version = "0.1.0"
description = "Speculative decoding: draft-then-verify with adaptive draft length (raises accepted-tokens/step, not just tok/s)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["sdecode"]

[tool.ruff]
line-length = 100
